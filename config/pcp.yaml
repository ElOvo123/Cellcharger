id_layout:
  total_bits: 11
  device_id_bits: 4
  message_id_bits: 7

messages:
  status:
    message_id: 0x12
    dlc: 8
    signals:
      voltage:
        start_bit: 0
        bit_length: 12
        signed: false
        scale: 0.01
        offset: 0.0

      current:
        start_bit: 12
        bit_length: 10
        signed: true
        scale: 0.1
        offset: 0.0

      temperature:
        start_bit: 22
        bit_length: 8
        signed: false
        scale: 1.0
        offset: -40.0

      state:
        start_bit: 30
        bit_length: 3
        signed: false
        scale: 1.0
        offset: 0.0