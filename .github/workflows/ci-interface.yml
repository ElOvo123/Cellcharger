name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen

    defaults:
      run:
        working-directory: Software/Interface

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-format \
            cmake \
            qt6-base-dev \
            qt6-serialport-dev \
            libyaml-cpp-dev \
            lcov \
            gcovr

      - name: Check formatting
        run: make format-check

      - name: Run tests
        run: make test

      - name: Run coverage gate
        run: make coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: Software/Interface/build-coverage/coverage-summary.txt
          if-no-files-found: ignore
